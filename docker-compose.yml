services:
  gwacheon-ahp-survey-api:
    build:
      context: ./backend
    container_name: gwacheon-ahp-survey-api
    # 메모리 천장 고정 (2026-08-23, archilaw winserver 이관 7단계). 실측 45.8MiB.
    # mem_limit=0이면 WSL2 VM OOM 시 커널이 희생자를 골라 운영 mongod까지 동반 사망한다.
    mem_limit: 256m
    ports:
      - "8005:8000"
    env_file:
      - ./backend/.env
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./backend/logs:/app/logs:rw
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - mongodb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  mongodb:
    external: true
    name: docker_search-community
